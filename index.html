<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="kyroo">
<meta property="og:image" content="portrait.webp">
<link rel="icon" href="portrait.webp">
<title>kyroo</title>
<meta name="description" content="kyroo – „nicht lange her“ jetzt überall streambar.">
<style>
/* Layout: eine ruhige Spalte wie eine Künstlerseite in Apple Music – großes Foto, Release, gruppierte Liste. */
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --sep:rgba(60,60,67,.14);
  --accent:#0071e3;
  --fill:rgba(118,118,128,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#1c1c1e;--text:#f5f5f7;--text-2:#98989d;--sep:rgba(84,84,88,.55);--accent:#2997ff;--fill:rgba(118,118,128,.24);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--text:#f5f5f7;--text-2:#98989d;--sep:rgba(84,84,88,.55);--accent:#2997ff;--fill:rgba(118,118,128,.24);color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:430px;margin:0 auto;padding-block:16px 36px;display:flex;flex-direction:column;gap:28px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}

/* Hero */
.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:538/640;max-width:100%;background:#8a9bb0}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.04);animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%)}
.hero-text{position:absolute;left:22px;right:22px;bottom:20px;z-index:1;color:#fff;display:flex;align-items:flex-end;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.hero h1{margin:0;font-size:52px;font-weight:700;letter-spacing:-.045em;line-height:1}
.hero p{margin:4px 0 0;font-size:15px;color:rgba(255,255,255,.78);letter-spacing:-.01em}

/* Abschnitte */
.section-title{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0 0 12px 4px}

/* Release */
.release{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:20px;padding:14px;transition:transform .2s}
.release:active{transform:scale(.98)}
.release img{width:96px;height:96px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.rel-info{min-width:0;flex:1}
.rel-kind{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.rel-title{font-size:20px;font-weight:600;margin-top:3px;letter-spacing:-.025em}
.rel-sub{font-size:14px;color:var(--text-2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;
  padding:7px 14px 7px 12px;border-radius:999px;letter-spacing:-.01em}
.pill svg{width:11px;height:11px}

/* Gruppierte Liste */
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;position:relative;transition:background .15s}
.row:hover{background:var(--fill)}
.row + .row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep);transform:scaleY(.6)}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.ic svg{width:18px;height:18px}
.ic.sp{background:#1db954}.ic.yt{background:#ff2d20}.ic.tt{background:#111}.ic.ig{background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#8a3ab9)}
:root[data-theme="dark"] .ic.tt{background:#333}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic.tt{background:#333}}
.row-text{min-width:0;flex:1}
.row-name{font-size:17px}
.row-hint{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;color:var(--text-2);opacity:.6;flex-shrink:0}

/* Fotos */
.photos img{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%;border-radius:20px;display:block}

/* Kontakt */
.contact{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px}
.c-label{font-size:13px;color:var(--text-2)}
.c-mail{font-size:16px;margin-top:2px;user-select:all;word-break:break-all}
.copy{margin-left:auto;flex-shrink:0;border:0;background:var(--fill);color:var(--accent);font:600 15px var(--font);padding:8px 16px;border-radius:999px;cursor:pointer}

footer{text-align:center;font-size:12px;color:var(--text-2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <img src="portrait.webp" alt="Porträt von kyroo vor dem Abendhimmel">
    <div class="hero-text">
      <div>
        <h1>kyroo</h1>
        <p>Musiker</p>
      </div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Neueste Veröffentlichung</h2>
    <a class="release" href="https://open.spotify.com/search/kyroo%20nicht%20lange%20her" target="_blank" rel="noopener">
      <img src="cover.webp" alt="Cover von „nicht lange her“">
      <div class="rel-info">
        <div class="rel-kind">Single</div>
        <div class="rel-title">nicht lange her</div>
        <div class="rel-sub">Überall streambar</div>
        <span class="pill"><svg viewBox="0 0 12 12"><path d="M2 1v10l9-5z" fill="currentColor"/></svg>Anhören</span>
      </div>
    </a>
  </section>

  <section>
    <h2 class="section-title">Folgen &amp; Hören</h2>
    <nav class="group" aria-label="Links">
      <a class="row" href="https://open.spotify.com/artist/2kujBRNjINvRbplLbow9sy" target="_blank" rel="noopener">
        <span class="ic sp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9.2c4-1.3 8.5-.9 12 1.1M6.8 12.9c3.2-.9 6.8-.6 9.6.9M7.6 16.4c2.5-.6 5.1-.4 7.2.7"/></svg></span>
        <span class="row-text"><span class="row-name">Spotify</span><div class="row-hint">Artist-Profil</div></span>
        <svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <a class="row" href="https://youtu.be/Ugjp6XvKGiw" target="_blank" rel="noopener">
        <span class="ic yt"><svg viewBox="0 0 24 24"><path d="M9.5 7.5v9l7.5-4.5z" fill="currentColor"/></svg></span>
        <span class="row-text"><span class="row-name">YouTube</span><div class="row-hint">Musikvideo ansehen</div></span>
        <svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <a class="row" href="https://www.tiktok.com/@kyroo.cc" target="_blank" rel="noopener">
        <span class="ic tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4v10.5a3 3 0 1 1-3-3"/><path d="M13.5 4c.4 2.2 2.1 3.9 4.3 4.3"/></svg></span>
        <span class="row-text"><span class="row-name">TikTok</span><div class="row-hint">@kyroo.cc</div></span>
        <svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <a class="row" href="https://www.instagram.com/kyroo.cc/" target="_blank" rel="noopener">
        <span class="ic ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="4.5" width="15" height="15" rx="4.5"/><circle cx="12" cy="12" r="3.4"/><circle cx="16.6" cy="7.4" r=".6" fill="currentColor" stroke="none"/></svg></span>
        <span class="row-text"><span class="row-name">Instagram</span><div class="row-hint">@kyroo.cc</div></span>
        <svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
    </nav>
  </section>

  <section class="photos" aria-label="Fotos">
    <img src="wide.webp" alt="kyroo auf einer Wiese vor bewaldeten Hügeln">
  </section>

  <section>
    <h2 class="section-title">Kontakt</h2>
    <div class="contact">
      <div style="min-width:0">
        <div class="c-label">Management &amp; Booking</div>
        <div class="c-mail" id="mail">kyroo.management@outlook.de</div>
      </div>
      <button class="copy" id="copy" type="button">Kopieren</button>
    </div>
  </section>

  <footer id="year">© kyroo</footer>
</main>

<script>
const btn=document.getElementById("copy");
btn.addEventListener("click",()=>{
  const mail="kyroo.management@outlook.de";
  const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Markiert"};
  try{navigator.clipboard.writeText(mail).then(()=>{btn.textContent="Kopiert";setTimeout(()=>btn.textContent="Kopieren",1800)}).catch(sel)}catch(e){sel()}
});
document.getElementById("year").textContent="© "+new Date().getFullYear()+" kyroo";
</script>

</body>
</html>
